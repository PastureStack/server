name: Scan managed runtime SBOMs

on:
  workflow_dispatch:
  push:
    branches: ['verification/security-refresh-*']
    paths:
      - '.github/workflows/scan-managed-runtime-sboms.yml'
      - 'scripts/scan-managed-runtime-sboms.py'
      - 'server/security/managed-runtime-inventory.json'

permissions:
  contents: read

concurrency:
  group: managed-runtime-sbom-${{ github.ref }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan immutable runtime artifacts without contacting deployments
        run: python3 scripts/scan-managed-runtime-sboms.py server/security/managed-runtime-inventory.json "$RUNNER_TEMP/managed-sbom"
      - name: Preserve reports separately from disposable scanner cache
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-sbom-${{ github.sha }}
          path: |
            ${{ runner.temp }}/managed-sbom/*.json
          if-no-files-found: error
          retention-days: 14
