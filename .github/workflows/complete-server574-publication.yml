name: Complete Server574 Publication

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  packages: read
  attestations: read

concurrency:
  group: publish-current-server-v1.6.574
  cancel-in-progress: false

jobs:
  complete:
    if: github.repository == 'PastureStack/server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Complete the exact original Server574 publication without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/complete-server574-publication.py
      - name: Retain the original failure and completion evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: server574-publication-completion-${{ github.run_id }}
          path: .server574-publication-completion
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
